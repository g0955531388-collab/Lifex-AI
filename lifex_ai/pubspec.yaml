name: lifex_ai
description: "Lifex-AI Global Health Network — منصة صحية ذكية شاملة للكشف المبكر والفحص الذاتي."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- الترجمة والدعم اللغوي الرسمي (l10n) ---
  intl: ^0.19.0

  # --- أيقونات ---
  cupertino_icons: ^1.0.6

  # --- إدارة الحالة وحقن الاعتماديات ---
  provider: ^6.1.2

  # --- التخزين المحلي الدائم ---
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # --- الصوت والذكاء اللغوي (وحدة voice) ---
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1

  # --- الكاميرا والرؤية الذكية (وحدة vision) ---
  camera: ^0.10.6
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0

  # --- الاتصال بين الأجهزة (وحدة network) ---
  flutter_blue_plus: ^1.32.12
  connectivity_plus: ^6.0.3
  network_info_plus: ^5.0.3

  # --- الطاقة والبطارية (وحدة energy) ---
  battery_plus: ^6.0.2

  # --- الموقع الجغرافي (شبكة الدم / المستشفيات القريبة) ---
  geolocator: ^12.0.0

  # --- الإشعارات (طوارئ، تنبيهات صحية) ---
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.2
  flutter_local_notifications: ^17.1.2

  # --- الاتصالات الطارئة (SMS احتياطي، مكالمات) ---
  url_launcher: ^6.3.0

  # --- التحديث عبر الإنترنت (قاعدة البيانات الطبية) ---
  http: ^1.2.1

  # --- التخزين الآمن (مفاتيح محركات الذكاء الاصطناعي الخارجية) ---
  flutter_secure_storage: ^9.2.2

  # --- التنسيق والتاريخ ---

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true

  assets:
    - lib/data/medical/diseases_database.json
    - lib/data/medical/medications_database.json
    - lib/data/medical/symptoms_database.json
    - lib/data/medical/tests_database.json
    - lib/data/medical/medical_knowledge.json
