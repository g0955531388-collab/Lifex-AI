name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Build APK
        run: |
          cd lifex_ai
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lifex-AI-APK
          path: lifex_ai/build/app/outputs/flutter-apk/app-release.apk

      - name: Create/update permanent GitHub Release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" \
            "lifex_ai/build/app/outputs/flutter-apk/app-release.apk" \
            --title "Lifex-AI APK — build ${{ github.run_number }}" \
            --notes "بناء تلقائي من commit ${{ github.sha }} على فرع ${{ github.ref_name }}. هذا ملف دائم (لا ينتهي كملفات Artifacts المؤقتة)." \
            --latest
